name: 'Build OnePlus Ace 5 Kernel with BakaSU'
description: 'Build a Lunaris giuliac kernel with BakaSU, SUSFS, NoMount, VPNHide and the GKI feature set'

inputs:
  op_config_json:
    description: 'JSON string containing full device config'
    required: true
  kernel_repo:
    description: 'Kernel repository (owner/name)'
    required: true
  kernel_branch:
    description: 'Kernel branch (informational)'
    required: true
  kernel_commit:
    description: 'Kernel commit SHA'
    required: true
  kernel_modules_repo:
    description: 'Kernel modules repository (sibling of kernel dir)'
    required: true
  kernel_modules_commit:
    description: 'Kernel modules commit SHA'
    required: true
  kernel_devicetrees_repo:
    description: 'Kernel devicetrees repository (sibling of kernel dir)'
    required: true
  kernel_devicetrees_commit:
    description: 'Kernel devicetrees commit SHA'
    required: true
  susfs_commit_hash_or_branch:
    description: 'SUSFS commit or branch'
    required: true
  nomount_commit:
    description: 'Pinned NoMount commit used for the in-kernel hooks'
    required: true
  bbg_repo:
    description: 'Baseband Guard repository'
    required: true
  bbg_commit:
    description: 'Pinned Baseband Guard commit'
    required: true
  kernel_patches_repo:
    description: 'Pinned Wild kernel patches repository'
    required: true
  kernel_patches_commit:
    description: 'Pinned Wild kernel patches commit'
  vpnhide_repo:
    description: 'VPNHide repository'
    required: true
  vpnhide_commit:
    description: 'Pinned VPNHide release commit'
    required: true
  droidspaces_commit:
    description: 'Pinned Droidspaces-OSS commit used for the SYSVIPC kABI patches'
    required: true
  gki_commit:
    description: 'Pinned WildKernels/GKI_KernelSU_SUSFS commit this run mirrors'
    required: true
  anykernel3_commit:
    description: 'Pinned AnyKernel3 commit staged from the synced tree'
    required: true
  anykernel3_repo:
    description: 'AnyKernel3 repository (owner/name)'
    required: true
  ksu_type:
    description: 'Select KSU Type'
    required: true
  ksu_branch_or_hash:
    description: 'BakaSU branch or commit hash'
    required: true
  build_timestamp:
    description: 'Custom kernel build timestamp shown in uname -a'
    required: false
    default: ''
  optimize_level:
    description: 'Compiler optimization level (O2 or O3)'
    required: false
    default: O2
  clean:
    description: 'Force clean build without ccache acceleration'
    required: false
    default: false
  debug:
    description: 'Enable dumping debug related artifacts'
    required: false
    default: false
  github_token:
    description: 'GitHub Token'
    required: true

outputs:
  kernel_version:
    description: 'Full kernel version string'
    value: ${{ steps.save_metadata.outputs.kernel_version }}
  ksu_version:
    description: 'KernelSU version number'
    value: ${{ steps.save_metadata.outputs.ksu_version }}
  ksu_type:
    description: 'KernelSU Variant'
    value: ${{ steps.save_metadata.outputs.ksu_type }}
  susfs_version:
    description: 'SUSFS version string'
    value: ${{ steps.save_metadata.outputs.susfs_version }}
  build_timestamp:
    description: 'Effective kernel build timestamp used in uname -a'
    value: ${{ steps.save_metadata.outputs.build_timestamp }}
  image_sha256:
    description: 'SHA256 hash of kernel Image'
    value: ${{ steps.collect_stats.outputs.image_sha256 }}
  zip_sha256:
    description: 'SHA256 hash of AnyKernel3 Zip'
    value: ${{ steps.create_zip.outputs.zip_sha256 }}
  warnings:
    description: 'Number of compiler warnings'
    value: ${{ steps.collect_stats.outputs.warnings_count }}
  build_time:
    description: 'Total build time in seconds'
    value: ${{ steps.collect_stats.outputs.build_time }}
  ccache_hit_rate:
    description: 'ccache hit rate percentage'
    value: ${{ steps.ccache_stats.outputs.hit_rate }}
  ccache_direct_rate:
    description: 'ccache direct hit rate percentage'
    value: ${{ steps.ccache_stats.outputs.direct_rate }}
  zip_name:
    description: 'Name of the generated flashable ZIP'
    value: ${{ steps.create_zip.outputs.zip_name }}

runs:
  using: 'composite'
  steps:
    - name: Parse op_config_json
      shell: bash
      run: |
        set -euo pipefail
        echo '${{ inputs.op_config_json }}' > /tmp/config.json
        jq -r 'to_entries[] | "OP_\(.key | ascii_upcase)=\(.value)"' /tmp/config.json >> "$GITHUB_ENV"
        echo "Parsed config:"
        jq '.' /tmp/config.json

    - name: Validate Inputs
      shell: bash
      run: |
        set -euo pipefail
        echo "::group::Validate inputs"
        model="$OP_MODEL"
        soc="$OP_SOC"
        android_version="$OP_ANDROID_VERSION"
        kernel_version="$OP_KERNEL_VERSION"
        os_version="$OP_OS_VERSION"
        lto="$OP_LTO"
        uname="$OP_UNAME"
        blacklist_modules="$OP_BLACKLIST_MODULES"
        optimize='${{ inputs.optimize_level }}'
        errors=()

        [[ -n "$model" && "$model" == OP* ]] || errors+=("model must start with OP. Got: '$model'")
        [[ -n "$soc" && "$soc" =~ ^[A-Za-z0-9_-]+$ ]] || errors+=("soc invalid. Got: '$soc'")
        [[ "$android_version" =~ ^android[0-9]+$ ]] || errors+=("android_version invalid. Got: '$android_version'")
        [[ "$kernel_version" =~ ^[0-9]+\.[0-9]+$ ]] || errors+=("kernel_version invalid. Got: '$kernel_version'")
        [[ "$os_version" == A* ]] || errors+=("os_version must start with A. Got: '$os_version'")
        [[ "$lto" =~ ^(none|thin|full)$ ]] || errors+=("lto invalid. Got: '$lto'")
        [[ ${#uname} -le 44 ]] || errors+=("uname too long (>44). Got: '$uname'")
        case "$optimize" in O2|O3) ;; *) errors+=("optimize_level must be O2 or O3. Got: '$optimize'");; esac
        for flag in susfs opt ds bbg bbr bbr3 ttl ip_set unicode ntsync; do
          eval "v=\$OP_$(echo "$flag" | tr 'a-z' 'A-Z')"
          [[ "$v" == true || "$v" == false ]] || errors+=("flag '$flag' must be true/false. Got: '$v'")
        done
        for sha in '${{ inputs.ksu_branch_or_hash }}' '${{ inputs.susfs_commit_hash_or_branch }}' '${{ inputs.gki_commit }}' '${{ inputs.kernel_patches_commit }}'; do
          [[ "$sha" =~ ^[0-9a-f]{7,40}$ ]] || errors+=("commit input is not a hash: '$sha'")
        done

        if [ ${#errors[@]} -ne 0 ]; then
          printf 'Validation error(s):\n'; printf '  - %s\n' "${errors[@]}" >&2
          echo "::error::Input validation failed. See logs for details."
          exit 1
        fi
        echo "✅ Input validation passed"
        echo "::endgroup::"

    - name: Set Dir Paths
      shell: bash
      run: |
        set -euo pipefail
        CONFIG_DIR="$GITHUB_WORKSPACE/$OP_MODEL"
        ARTIFACTS_DIR="$CONFIG_DIR/artifacts"
        KERNEL_DIR="$CONFIG_DIR/sm8650"
        KERNEL_MODULES_DIR="$CONFIG_DIR/sm8650-modules"
        KERNEL_DEVICETREES_DIR="$CONFIG_DIR/sm8650-devicetrees"
        AK3_DIR="$CONFIG_DIR/AnyKernel3"
        DEBUG_ARTIFACTS_DIR="$GITHUB_WORKSPACE/debug_artifacts"
        KERNEL_PATCHES_DIR="$GITHUB_WORKSPACE/kernel_patches"
        SUSFS_DIR="$GITHUB_WORKSPACE/susfs4ksu"
        VPNHIDE_DIR="$GITHUB_WORKSPACE/vpnhide"
        mkdir -p "$ARTIFACTS_DIR" "$DEBUG_ARTIFACTS_DIR"
        {
          echo "CONFIG_FOLDER=$CONFIG_DIR"
          echo "ARTIFACTS_FOLDER=$ARTIFACTS_DIR"
          echo "KERNEL_FOLDER=$KERNEL_DIR"
          echo "KERNEL_MODULES_FOLDER=$KERNEL_MODULES_DIR"
          echo "KERNEL_DEVICETREES_FOLDER=$KERNEL_DEVICETREES_DIR"
          echo "AK3_FOLDER=$AK3_DIR"
          echo "DEBUG_ARTIFACTS_FOLDER=$DEBUG_ARTIFACTS_DIR"
          echo "KERNEL_PATCHES_FOLDER=$KERNEL_PATCHES_DIR"
          echo "SUSFS_FOLDER=$SUSFS_DIR"
          echo "VPNHIDE_FOLDER=$VPNHIDE_DIR"
          echo "CCACHE_DIR=$GITHUB_WORKSPACE/.ccache"
          echo "CCACHE_LOGFILE=$GITHUB_WORKSPACE/ccache.log"
          echo "CCACHE_BASEDIR=$GITHUB_WORKSPACE"
          echo "CCACHE_MAXSIZE=12G"
          echo "DEBUG_ZIP_NAME=debug_${OP_MODEL}_${OP_OS_VERSION}.zip"
        } >> "$GITHUB_ENV"

    - name: Sync Kernel Source
      id: sync-kernel-source
      uses: ./.github/actions/kernel-source-sync
      with:
        source_location: ${{ env.CONFIG_FOLDER }}
        kernel_repo: ${{ inputs.kernel_repo }}
        kernel_branch: ${{ inputs.kernel_branch }}
        kernel_commit: ${{ inputs.kernel_commit }}
        kernel_modules_repo: ${{ inputs.kernel_modules_repo }}
        kernel_modules_commit: ${{ inputs.kernel_modules_commit }}
        kernel_devicetrees_repo: ${{ inputs.kernel_devicetrees_repo }}
        kernel_devicetrees_commit: ${{ inputs.kernel_devicetrees_commit }}
        anykernel3_repo: ${{ inputs.anykernel3_repo }}
        anykernel3_commit: ${{ inputs.anykernel3_commit }}
        github_token: ${{ inputs.github_token }}
        debug: ${{ inputs.debug }}

    - name: Detect Clang Toolchain
      shell: bash
      run: |
        set -euo pipefail
        echo "::group::Detect Clang"
        CLANG_BIN=""
        if [ -n "$OP_C_COMPILER" ] && [ -x "$CONFIG_FOLDER/$OP_C_COMPILER/clang" ]; then
          CLANG_BIN="$CONFIG_FOLDER/$OP_C_COMPILER"
        elif [ -x "$CONFIG_FOLDER/toolchain/clang/bin/clang" ]; then
          CLANG_BIN="$CONFIG_FOLDER/toolchain/clang/bin"
        elif command -v clang >/dev/null 2>&1; then
          CLANG_BIN="$(dirname "$(command -v clang)")"
        fi
        [ -n "$CLANG_BIN" ] || { echo "::error::No clang toolchain found"; exit 1; }
        echo "CLANG_BIN_PATH=$CLANG_BIN" >> "$GITHUB_ENV"
        echo "$CLANG_BIN" >> "$GITHUB_PATH"
        CLANG_VERSION="$("$CLANG_BIN/clang" --version | head -n1)"
        echo "CLANG_VERSION=$CLANG_VERSION" >> "$GITHUB_ENV"
        echo "✅ Detected Clang: $CLANG_VERSION"
        echo "::endgroup::"

    - name: Check ccache
      shell: bash
      run: |
        echo "::group::Check ccache"
        set -euo pipefail
        echo "/usr/lib/ccache" >> $GITHUB_PATH
        if [ -d "$CCACHE_DIR" ] && find "$CCACHE_DIR" -maxdepth 2 -type f -print -quit 2>/dev/null | grep -q .; then
          echo "✅ Restored cache found"
        else
          echo "⚠️ No existing cache - building from scratch"
        fi
        ccache -z
        rm -f "$CCACHE_DIR/ccache.log" || true
        echo "::endgroup::"

    - name: Fetch Feature Patch Sources
      shell: bash
      run: |
        echo "::group::Fetch feature patch sources"
        set -euo pipefail

        clone_at() {
          local url="$1" ref="$2" dir="$3" depth="${4:-1}"
          rm -rf "$dir"
          git clone --no-checkout "$url" "$dir"
          git -C "$dir" fetch --depth="$depth" origin "$ref" || git -C "$dir" fetch --depth=1 origin "$ref"
          git -C "$dir" checkout --detach FETCH_HEAD
        }

        clone_at "https://github.com/${{ inputs.kernel_patches_repo }}.git" "${{ inputs.kernel_patches_commit }}" "$KERNEL_PATCHES_FOLDER" 0
        test "$(git -C "$KERNEL_PATCHES_FOLDER" rev-parse HEAD)" = "${{ inputs.kernel_patches_commit }}"

        if [ "$OP_SUSFS" = true ]; then
          SUSFS_BRANCH="${{ inputs.susfs_commit_hash_or_branch }}"
          rm -rf "$SUSFS_FOLDER"
          git clone --no-checkout https://gitlab.com/simonpunk/susfs4ksu.git "$SUSFS_FOLDER"
          git -C "$SUSFS_FOLDER" fetch --depth=1 origin "$SUSFS_BRANCH"
          git -C "$SUSFS_FOLDER" checkout --detach FETCH_HEAD
          echo "SUSFS_COMMIT_SHA=$(git -C "$SUSFS_FOLDER" rev-parse HEAD)" >> "$GITHUB_ENV"
        fi
        echo "✅ Feature patch sources ready"
        echo "::endgroup::"

    - name: Add BakaSU
      if: ${{ inputs.ksu_type == 'BakaSU' }}
      shell: bash
      run: |
        set -euo pipefail
        echo "::group::Add BakaSU"
        cd "$KERNEL_FOLDER"
        git clone --no-checkout https://github.com/Baka-SU/BakaSU.git KernelSU
        cd KernelSU
        git fetch origin '${{ inputs.ksu_branch_or_hash }}'
        git checkout --detach '${{ inputs.ksu_branch_or_hash }}'
        git submodule update --init --recursive
        KSU_VERSION=$((30700 + $(git rev-list --count HEAD)))
        cd ..

        # BakaSU's kernel/tools/susfs_compat.mk ends with an unconditional
        # $(error "Please wait susfs update.") that fires on every
        # CONFIG_KSU_SUSFS=y build. The grep-based KSU_COMPAT_HAS_* shims above
        # that gate are what adapt the code to the SUSFS layout, so keep them
        # and strip only the hard stop. Mirrors the GKI root-setup action.
        SUSFS_COMPAT="KernelSU/kernel/tools/susfs_compat.mk"
        if [ -f "$SUSFS_COMPAT" ] && grep -q 'Please wait susfs update' "$SUSFS_COMPAT"; then
          sed -i '/susfs has NOT update with latest KernelSU source/,$d' "$SUSFS_COMPAT"
          echo "Stripped susfs_compat hard stop from $SUSFS_COMPAT"
        fi

        KSU_COMMIT_SHA=$(git -C KernelSU rev-parse HEAD)
        echo "KSU_COMMIT_SHA=$KSU_COMMIT_SHA" >> "$GITHUB_ENV"
        echo "NEED_HOOKS=false" >> "$GITHUB_ENV"

        insert_before_last_endmenu() {
          local file="$1" line="$2"
          grep -Fqx "$line" "$file" && return 0
          awk -v line="$line" '
            { lines[NR] = $0 }
            END {
              last = 0
              for (i = 1; i <= NR; i++) if (lines[i] ~ /^endmenu[[:space:]]*$/) last = i
              if (!last) print line
              for (i = 1; i <= NR; i++) { if (i == last) print line; print lines[i] }
            }' "$file" > "$file.tmp"
          mv "$file.tmp" "$file"
        }
        ln -sfn "$(realpath --relative-to="$KERNEL_FOLDER/drivers" "$KERNEL_FOLDER/KernelSU/kernel")" "$KERNEL_FOLDER/drivers/kernelsu"
        insert_before_last_endmenu "$KERNEL_FOLDER/drivers/Kconfig" 'source "drivers/kernelsu/Kconfig"'
        grep -q 'obj-$(CONFIG_KSU) += kernelsu/' "$KERNEL_FOLDER/drivers/Makefile" || printf '\nobj-$(CONFIG_KSU) += kernelsu/\n' >> "$KERNEL_FOLDER/drivers/Makefile"
        echo 'CONFIG_KSU=y' >> "$KERNEL_FOLDER/arch/arm64/configs/gki_defconfig"
        echo "$KSU_VERSION" >> "${ARTIFACTS_FOLDER}/${OP_MODEL}_${OP_OS_VERSION}.txt"
        echo "KSUVER=$KSU_VERSION" >> "$GITHUB_ENV"
        echo "✅ BakaSU added (commit: ${KSU_COMMIT_SHA:0:8})"
        echo "::endgroup::"

    - name: Apply SUSFS Patches
      if: ${{ env.OP_SUSFS == 'true' }}
      shell: bash
      run: |
        set -euo pipefail
        echo "::group::Apply SUSFS patches"
        cd "$KERNEL_FOLDER"
        SUSFS_BRANCH="gki-$OP_ANDROID_VERSION-$OP_KERNEL_VERSION"
        cp "$SUSFS_FOLDER/kernel_patches/fs/"* "$KERNEL_FOLDER/fs/"
        cp "$SUSFS_FOLDER/kernel_patches/include/linux/"* "$KERNEL_FOLDER/include/linux/"
        susfs_version=$(grep '#define SUSFS_VERSION' "$KERNEL_FOLDER/include/linux/susfs.h" | awk -F'"' '{print $2}')
        echo "SUSVER=$susfs_version" >> "$GITHUB_ENV"
        {
          echo "CONFIG_KSU_SUSFS=y"
          echo "CONFIG_KSU_SUSFS_HAS_MAGIC_MOUNT=y"
          echo "CONFIG_KSU_SUSFS_SUS_PATH=y"
          echo "CONFIG_KSU_SUSFS_SUS_MOUNT=y"
          echo "CONFIG_KSU_SUSFS_AUTO_ADD_SUS_KSU_DEFAULT_MOUNT=y"
          echo "CONFIG_KSU_SUSFS_AUTO_ADD_SUS_BIND_MOUNT=y"
          echo "CONFIG_KSU_SUSFS_SUS_KSTAT=y"
          echo "CONFIG_KSU_SUSFS_TRY_UMOUNT=y"
          echo "CONFIG_KSU_SUSFS_AUTO_ADD_TRY_UMOUNT_FOR_BIND_MOUNT=y"
          echo "CONFIG_KSU_SUSFS_SPOOF_UNAME=y"
          echo "CONFIG_KSU_SUSFS_ENABLE_LOG=y"
          echo "CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS=y"
          echo "CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG=y"
          echo "CONFIG_KSU_SUSFS_OPEN_REDIRECT=y"
          echo "CONFIG_KSU_SUSFS_SUS_MAP=y"
          echo "CONFIG_KSU_SUSFS_SUS_SU=n"
        } >> "$KERNEL_FOLDER/arch/arm64/configs/gki_defconfig"
        patch_file="$SUSFS_FOLDER/kernel_patches/50_add_susfs_in_${SUSFS_BRANCH}.patch"
        [ -f "$patch_file" ] || { echo "::error::SUSFS patch not found: $patch_file"; exit 1; }

        # Tree-specific fake patch: on android14-6.1 sublevel >= 157 the tree
        # carries an extra `#include <trace/hooks/blk.h>` in fs/namespace.c
        # that shifts the SUSFS hunk #1 context. The GKI tree can just drop it
        # because it declares the do_new_mount_fc hook elsewhere; this tree
        # declares it in blk.h, so relocate the include above mnt_idmapping.h
        # instead of deleting it.
        SUBLEVEL=$(awk '/^SUBLEVEL *=/{print $3}' Makefile)
        if [ "$OP_KERNEL_VERSION" = "6.1" ] && [ "${SUBLEVEL:-0}" -ge 157 ]; then
          if grep -q '^#include <trace/hooks/blk.h>$' fs/namespace.c; then
            sed -i '/^#include <trace\/hooks\/blk.h>$/d' fs/namespace.c
            sed -i '/^#include <uapi\/linux\/mount.h>$/a #include <trace/hooks/blk.h>' fs/namespace.c
          fi
        fi

        patch -p1 < "$patch_file"

        # The SUSFS 50_add patch only `extern`s `struct selinux_state
        # fake_state` and expects the root implementation to define AND
        # populate it. For the kernelsu flavor susfs4ksu ships that glue as
        # kernel_patches/KernelSU/10_enable_susfs_for_ksu.patch; a root that has
        # not synced it (BakaSU main HEAD delegates selinux_hide to SUSFS when
        # the manual hook is present) links `undefined symbol: fake_state`.
        # apply_susfs_root_glue.py restores the same glue inside the root's
        # selinux_hide.c, and is a no-op once the root provides it.
        SH_FILE="KernelSU/kernel/feature/selinux_hide.c"
        if [ -f "$SH_FILE" ]; then
          python3 "$GITHUB_WORKSPACE/scripts/apply_susfs_root_glue.py" "$SH_FILE"
        fi

        echo "SusFS Version: $susfs_version"
        echo "✅ SUSFS patches applied"
        echo "::endgroup::"

    - name: Add NoMount
      shell: bash
      run: |
        set -euo pipefail
        echo "::group::Add NoMount"
        cd "$KERNEL_FOLDER"
        git clone --no-checkout https://github.com/maxsteeel/nomount.git NoMount
        git -C NoMount fetch --depth=1 origin '${{ inputs.nomount_commit }}'
        git -C NoMount checkout --detach FETCH_HEAD
        test "$(git -C NoMount rev-parse HEAD)" = '${{ inputs.nomount_commit }}'
        mkdir -p fs/nomount
        cp NoMount/kernel/src/Kconfig NoMount/kernel/src/Makefile NoMount/kernel/src/nomount.c NoMount/kernel/src/nomount.h fs/nomount/
        insert_before_last_endmenu() {
          local file="$1" line="$2"
          grep -Fqx "$line" "$file" && return 0
          awk -v line="$line" '
            { lines[NR] = $0 }
            END {
              last = 0
              for (i = 1; i <= NR; i++) if (lines[i] ~ /^endmenu[[:space:]]*$/) last = i
              if (!last) print line
              for (i = 1; i <= NR; i++) { if (i == last) print line; print lines[i] }
            }' "$file" > "$file.tmp"
          mv "$file.tmp" "$file"
        }
        insert_before_last_endmenu fs/Kconfig 'source "fs/nomount/Kconfig"'
        grep -q 'obj-$(CONFIG_NOMOUNT) += nomount/' fs/Makefile || printf '\nobj-$(CONFIG_NOMOUNT) += nomount/\n' >> fs/Makefile
        echo 'CONFIG_NOMOUNT=y' >> arch/arm64/configs/gki_defconfig
        echo "NOMOUNT_COMMIT_SHA=${{ inputs.nomount_commit }}" >> "$GITHUB_ENV"
        echo "✅ NoMount added"
        echo "::endgroup::"

    - name: Add BBG
      if: ${{ env.OP_BBG == 'true' }}
      shell: bash
      run: |
        set -euo pipefail
        echo "::group::Add BBG LSM"
        cd "$KERNEL_FOLDER"
        git clone --no-checkout "https://github.com/${{ inputs.bbg_repo }}.git" Baseband-guard
        git -C Baseband-guard fetch --depth=1 origin '${{ inputs.bbg_commit }}'
        git -C Baseband-guard checkout --detach FETCH_HEAD
        test "$(git -C Baseband-guard rev-parse HEAD)" = '${{ inputs.bbg_commit }}'
        ln -sfn "$(realpath --relative-to="$KERNEL_FOLDER/security" "$KERNEL_FOLDER/Baseband-guard")" "$KERNEL_FOLDER/security/baseband-guard"
        grep -q 'baseband-guard/baseband_guard.o' "$KERNEL_FOLDER/security/Makefile" || printf '\nobj-$(CONFIG_BBG) += baseband-guard/\n' >> "$KERNEL_FOLDER/security/Makefile"
        insert_before_last_endmenu() {
          local file="$1" line="$2"
          grep -Fqx "$line" "$file" && return 0
          awk -v line="$line" '
            { lines[NR] = $0 }
            END {
              last = 0
              for (i = 1; i <= NR; i++) if (lines[i] ~ /^endmenu[[:space:]]*$/) last = i
              if (!last) print line
              for (i = 1; i <= NR; i++) { if (i == last) print line; print lines[i] }
            }' "$file" > "$file.tmp"
          mv "$file.tmp" "$file"
        }
        insert_before_last_endmenu security/Kconfig 'source "security/baseband-guard/Kconfig"'
        echo "CONFIG_BBG=y" >> arch/arm64/configs/gki_defconfig
        sed -i '/^config LSM$/,/^help$/{ /^[[:space:]]*default/ { /baseband_guard/! s/selinux/selinux,baseband_guard/ } }' security/Kconfig
        echo "✅ BBG LSM added"
        echo "::endgroup::"

    - name: Apply Networking, BBRv3, NTSync, Unicode, Droidspaces
      shell: bash
      run: |
        set -euo pipefail
        echo "::group::Apply GKI-driven feature patches"
        cd "$KERNEL_FOLDER"
        GKI_KEY="$OP_ANDROID_VERSION-$OP_KERNEL_VERSION"

        # --- Networking config (IP Set, TCP CC, qdisc). PIE/FQ_PIE stay local. ---
        {
          echo "CONFIG_TCP_CONG_ADVANCED=y"
          echo "CONFIG_TCP_CONG_BBR=y"
          echo "CONFIG_NET_SCH_FQ=y"
          echo "CONFIG_NET_SCH_FQ_CODEL=y"
          echo "CONFIG_NET_SCH_CAKE=y"
          echo "CONFIG_NET_SCH_PIE=y"
          echo "CONFIG_NET_SCH_FQ_PIE=y"
          echo "CONFIG_IP_SET=y"
          echo "CONFIG_IP_SET_MAX=65534"
          echo "CONFIG_IP_SET_BITMAP_IP=y"
          echo "CONFIG_IP_SET_BITMAP_IPMAC=y"
          echo "CONFIG_IP_SET_BITMAP_PORT=y"
          echo "CONFIG_IP_SET_HASH_IP=y"
          echo "CONFIG_IP_SET_HASH_IPMARK=y"
          echo "CONFIG_IP_SET_HASH_IPPORT=y"
          echo "CONFIG_IP_SET_HASH_IPPORTIP=y"
          echo "CONFIG_IP_SET_HASH_IPPORTNET=y"
          echo "CONFIG_IP_SET_HASH_IPMAC=y"
          echo "CONFIG_IP_SET_HASH_MAC=y"
          echo "CONFIG_IP_SET_HASH_NETPORTNET=y"
          echo "CONFIG_IP_SET_HASH_NET=y"
          echo "CONFIG_IP_SET_HASH_NETNET=y"
          echo "CONFIG_IP_SET_HASH_NETPORT=y"
          echo "CONFIG_IP_SET_HASH_NETIFACE=y"
          echo "CONFIG_IP_SET_LIST_SET=y"
          echo "CONFIG_NETFILTER_XT_MATCH_ADDRTYPE=y"
          echo "CONFIG_NETFILTER_XT_SET=y"
          echo "CONFIG_IP6_NF_NAT=y"
          echo "CONFIG_IP6_NF_TARGET_MASQUERADE=y"
          echo "CONFIG_IP_NF_TARGET_TTL=y"
          echo "CONFIG_IP6_NF_TARGET_HL=y"
          echo "CONFIG_IP6_NF_MATCH_HL=y"
        } >> arch/arm64/configs/gki_defconfig

        if [ "$OP_BBR3" = true ]; then
          { echo "CONFIG_TCP_CONG_BBR3=y"; } >> arch/arm64/configs/gki_defconfig
          bbrv3_patch="$KERNEL_PATCHES_FOLDER/common/bbrv3/0001-net-tcp-backport-BBRv3-to-$GKI_KEY.patch"
          [ -f "$bbrv3_patch" ] || { echo "::error::BBRv3 patch missing: $bbrv3_patch"; exit 1; }
          patch -p1 < "$bbrv3_patch"
        fi

        if [ "$OP_NTSYNC" = true ]; then
          ntsync_patch="$KERNEL_PATCHES_FOLDER/common/ntsync/ntsync_compat_$GKI_KEY.patch"
          [ -f "$ntsync_patch" ] || { echo "::error::NTSync patch missing: $ntsync_patch"; exit 1; }
          patch -p1 < "$ntsync_patch"
          patch -p1 < "$KERNEL_PATCHES_FOLDER/common/ntsync/ntsync_base.patch"
          echo "CONFIG_NTSYNC=y" >> arch/arm64/configs/gki_defconfig
        fi

        if [ "$OP_UNICODE" = true ]; then
          patch -p1 < "$KERNEL_PATCHES_FOLDER/common/unicode_bypass_fix_6.1+.patch"
        fi

        if [ "$OP_DS" = true ]; then
          rm -rf "$GITHUB_WORKSPACE/Droidspaces-OSS"
          git clone --depth=1 https://github.com/ravindu644/Droidspaces-OSS.git "$GITHUB_WORKSPACE/Droidspaces-OSS"
          git -C "$GITHUB_WORKSPACE/Droidspaces-OSS" fetch --depth=1 origin '${{ inputs.droidspaces_commit }}'
          git -C "$GITHUB_WORKSPACE/Droidspaces-OSS" checkout '${{ inputs.droidspaces_commit }}'
          test "$(git -C "$GITHUB_WORKSPACE/Droidspaces-OSS" rev-parse HEAD)" = '${{ inputs.droidspaces_commit }}'
          patch -p1 < "$KERNEL_PATCHES_FOLDER/common/droidspaces/fix_sysvipc_kabi_6_7_8.patch"
          patch -p1 < "$KERNEL_PATCHES_FOLDER/common/droidspaces/0001-Return-ghost-task-if-task-is-null-and-is-requested-b.patch"
          {
            echo "CONFIG_SYSVIPC=y"
            echo "CONFIG_DEVTMPFS=y"
            echo "CONFIG_PID_NS=y"
            echo "CONFIG_POSIX_MQUEUE=y"
            echo "CONFIG_USER_NS=y"
          } >> arch/arm64/configs/gki_defconfig
        fi

        {
          echo "CONFIG_TMPFS_XATTR=y"
          echo "CONFIG_TMPFS_POSIX_ACL=y"
        } >> arch/arm64/configs/gki_defconfig
        echo "✅ GKI-driven feature patches applied"
        echo "::endgroup::"

    - name: Integrate VPNHide built-in backend
      shell: bash
      run: |
        set -euo pipefail
        echo "::group::Integrate VPNHide built-in backend"
        rm -rf "$VPNHIDE_FOLDER"
        git clone --no-checkout "https://github.com/${{ inputs.vpnhide_repo }}.git" "$VPNHIDE_FOLDER"
        git -C "$VPNHIDE_FOLDER" fetch --depth=1 origin '${{ inputs.vpnhide_commit }}'
        git -C "$VPNHIDE_FOLDER" checkout --detach FETCH_HEAD
        test "$(git -C "$VPNHIDE_FOLDER" rev-parse HEAD)" = '${{ inputs.vpnhide_commit }}'
        mkdir -p "$GITHUB_WORKSPACE/source-snapshot"
        python3 "$VPNHIDE_FOLDER/builtin/scripts/integrate.py" apply \
          --kernel "$KERNEL_FOLDER" \
          --kmi "$OP_ANDROID_VERSION-$OP_KERNEL_VERSION" \
          --output "$GITHUB_WORKSPACE/source-snapshot/vpnhide-integration"
        jq -e --arg sha '${{ inputs.vpnhide_commit }}' '
          .status == "applied" and .vpnhide_revision == $sha and
          .checks.patch_round_trip == "passed" and
          ([.edits[].status] | all(. == "matched"))
        ' "$GITHUB_WORKSPACE/source-snapshot/vpnhide-integration/report.json"
        {
          echo "CONFIG_VPNHIDE=y"
          echo "CONFIG_VPNHIDE_FS_HIDING=y"
        } >> "$KERNEL_FOLDER/arch/arm64/configs/gki_defconfig"
        echo "VPNHIDE_COMMIT_SHA=${{ inputs.vpnhide_commit }}" >> "$GITHUB_ENV"
        echo "VPNHide built-in backend integrated"
        echo "::endgroup::"

    - name: Get Kernel Version Info
      shell: bash
      run: |
        set -euo pipefail
        cd "$KERNEL_FOLDER"
        VERSION=$(grep '^VERSION *=' Makefile | awk '{print $3}')
        PATCHLEVEL=$(grep '^PATCHLEVEL *=' Makefile | awk '{print $3}')
        SUBLEVEL=$(grep '^SUBLEVEL *=' Makefile | awk '{print $3}')
        FULL_VERSION="$VERSION.$PATCHLEVEL.$SUBLEVEL"
        cd "$ARTIFACTS_FOLDER"
        {
          echo "$OP_ANDROID_VERSION-$FULL_VERSION" > "${OP_MODEL}_${OP_OS_VERSION}.txt"
          echo "$OP_OS_VERSION" >> "${OP_MODEL}_${OP_OS_VERSION}.txt"
        }
        {
          echo "ANDROID_VER=$OP_ANDROID_VERSION"
          echo "KERNEL_VER=$VERSION.$PATCHLEVEL"
          echo "TKERNEL_VER=$FULL_VERSION"
          echo "KERNEL_FULL_VER=$OP_ANDROID_VERSION-$FULL_VERSION"
        } >> "$GITHUB_ENV"
        echo "✅ Detected: $OP_ANDROID_VERSION-$FULL_VERSION"
        echo "::endgroup::"

    - name: Apply Stock Config Spoof
      shell: bash
      env:
        GKI_VERSION: ${{ env.OP_ANDROID_VERSION }}-${{ env.OP_KERNEL_VERSION }}
      run: |
        set -euo pipefail
        echo "::group::Stock config spoof"
        cd "$KERNEL_FOLDER"
        KVER="$OP_KERNEL_VERSION"
        TMP="$(mktemp -d)"
        SUBDIR=""
        case "${KVER}-4k" in 6.1-16k|6.6-16k|6.12-16k) SUBDIR="/16k" ;; esac
        MAJ="${OP_ANDROID_VERSION#android}"
        BASE="https://android.googlesource.com/kernel/prebuilts/${KVER}/arm64"
        IMG="$TMP/kernel-${KVER}-gz"
        STOCK="$TMP/stock_defconfig"
        ok=0
        for REF in "refs/heads/main" "refs/heads/android${MAJ}-release"; do
          URL="${BASE}/+/${REF}${SUBDIR}/kernel-${KVER}-gz?format=TEXT"
          if curl -fsSL --retry 3 --retry-delay 5 --max-time 600 "$URL" | base64 -d > "$IMG" && [ -s "$IMG" ]; then ok=1; break; fi
          rm -f "$IMG"
        done
        [ "$ok" = 1 ] || { echo "::error::Unable to download stock GKI prebuilt kernel-${KVER}-gz (spoof is mandatory)"; exit 1; }
        sh scripts/extract-ikconfig "$IMG" > "$STOCK" || { echo "::error::extract-ikconfig failed on stock prebuilt"; exit 1; }
        head -n 5 "$STOCK" | grep -q "Kernel Configuration" || { echo "::error::Extracted stock config missing header"; exit 1; }
        if grep -qE 'CONFIG_KSU|SCHED_BORE|SUSFS' "$STOCK"; then echo "::error::Stock config unexpectedly contains KSU/SUSFS/BORE markers"; exit 1; fi
        cp "$STOCK" arch/arm64/configs/stock_defconfig
        MK="kernel/Makefile"
        grep -qF '$(obj)/config_data:' "$MK" || { echo "::error::No \$(obj)/config_data rule in kernel/Makefile"; exit 1; }
        sed -i 's|$(obj)/config_data: $(KCONFIG_CONFIG) FORCE|$(obj)/config_data: arch/arm64/configs/stock_defconfig FORCE|' "$MK"
        grep -qF 'config_data: arch/arm64/configs/stock_defconfig FORCE' "$MK" || { echo "::error::config_data rule was not repointed to stock_defconfig"; exit 1; }
        STOCK_SHA256=$(sha256sum "$STOCK" | awk '{print $1}')
        echo "STOCK_CONFIG_SHA256=$STOCK_SHA256" >> "$GITHUB_ENV"
        echo "STOCK_CONFIG_LINES=$(wc -l < "$STOCK" | tr -d ' ')" >> "$GITHUB_ENV"
        rm -rf "$TMP"
        echo "✅ Stock config spoof staged (/proc/config.gz will report stock). sha256=$STOCK_SHA256"
        echo "::endgroup::"

    - name: Build Kernel
      id: build_kernel_step
      shell: bash
      env:
        PYTHONWARNINGS: "ignore:invalid escape sequence"
      run: |
        set -euo pipefail
        echo "::group::Build kernel with ccache optimization"
        cd "$KERNEL_FOLDER"
        : > "$KERNEL_FOLDER/.scmversion"

        export LLVM=1 LLVM_IAS=1
        export ARCH=arm64 SUBARCH=arm64
        export LD=ld.lld HOSTLD=ld.lld AR=llvm-ar NM=llvm-nm
        export OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump STRIP=llvm-strip
        export CC="ccache clang" CXX="ccache clang++" HOSTCC="ccache clang" HOSTCXX="ccache clang++"

        KERNEL_BUILD_DATE=$(date -u)
        export SOURCE_DATE_EPOCH=$(git log -1 --format=%ct 2>/dev/null || date +%s)
        export KBUILD_BUILD_TIMESTAMP="${{ inputs.build_timestamp }}"
        [ -n "$KBUILD_BUILD_TIMESTAMP" ] || export KBUILD_BUILD_TIMESTAMP="$KERNEL_BUILD_DATE"
        export KBUILD_BUILD_USER="OnePlus"
        export KBUILD_BUILD_HOST="ubuntu-build"
        export KBUILD_BUILD_VERSION=1
        echo "EFFECTIVE_BUILD_TIMESTAMP=$KBUILD_BUILD_TIMESTAMP" >> "$GITHUB_ENV"

        OUT=out
        mkdir -p "$OUT"

        # certs/extract-cert.c declares key_pass only under USE_PKCS11_ENGINE,
        # but uses it under #ifndef OPENSSL_IS_BORINGSSL. With host OpenSSL 3
        # (no pkcs11 engine) USE_PKCS11_ENGINE is undefined, so the host tool
        # fails to compile. Make the declaration unconditional; key_pass is
        # only read when a pkcs11: cert source is used, which this build never
        # does.
        perl -0pi -e 's/#ifdef USE_PKCS11_ENGINE\n(static const char \*key_pass;\n)#endif\n/$1/' certs/extract-cert.c
        grep -q '^static const char \*key_pass;$' certs/extract-cert.c || { echo "::error::extract-cert.c key_pass fix did not apply"; exit 1; }

        make O="$OUT" gki_defconfig vendor/pineapple_GKI.config vendor/oplus/pineapple_GKI.config

        LOCAL_LOCALVERSION="-${OP_ANDROID_VERSION}-${OP_UNAME}"
        scripts/config --file "$OUT/.config" --set-str LOCALVERSION "$LOCAL_LOCALVERSION"
        scripts/config --file "$OUT/.config" -d LOCALVERSION_AUTO || true

        if [ "${{ inputs.optimize_level }}" = "O3" ]; then
          scripts/config --file "$OUT/.config" -d CC_OPTIMIZE_FOR_PERFORMANCE -e CC_OPTIMIZE_FOR_PERFORMANCE_O3
          KCFLAGS_EXTRA="-O3"
        else
          scripts/config --file "$OUT/.config" -e CC_OPTIMIZE_FOR_PERFORMANCE -d CC_OPTIMIZE_FOR_PERFORMANCE_O3
          KCFLAGS_EXTRA="-O2"
        fi

        scripts/config --file "$OUT/.config" -e LTO_CLANG -d LTO_CLANG_NONE -d LTO_CLANG_THIN -d LTO_CLANG_FULL
        case "$OP_LTO" in
          none) scripts/config --file "$OUT/.config" -e LTO_CLANG_NONE ;;
          thin) scripts/config --file "$OUT/.config" -e LTO_CLANG_THIN ;;
          full) scripts/config --file "$OUT/.config" -e LTO_CLANG_FULL ;;
          *) echo "::error::Unsupported LTO option: $OP_LTO"; exit 1 ;;
        esac

        make O="$OUT" olddefconfig
        bash "$GITHUB_WORKSPACE/scripts/verify_kernel_config.sh" "$OUT/.config" "$KERNEL_FOLDER"
        cp "$OUT/.config" "$ARTIFACTS_FOLDER/${OP_MODEL}_${OP_OS_VERSION}_${KERNEL_FULL_VER}.config"
        cp "$OUT/.config" "$DEBUG_ARTIFACTS_FOLDER/${OP_MODEL}_${OP_OS_VERSION}_${KERNEL_FULL_VER}.config"

        BUILD_START=$(date +%s)
        # HOSTCFLAGS: clang-r563880c is stricter than the clang the tree
        # expects and trips -Werror on the host-side resolve_btfids/libbpf.c
        # (strchr const-qualifier discard). Suppress that class for host tools.
        HOSTFLAGS="-Wno-error -Wno-incompatible-pointer-types-discards-qualifiers"
        make -j"$(nproc --all)" O="$OUT" HOSTCFLAGS="$HOSTFLAGS" KCFLAGS="-Wno-error -pipe ${KCFLAGS_EXTRA}" Image 2>&1 | tee build.log
        make -j"$(nproc --all)" O="$OUT" HOSTCFLAGS="$HOSTFLAGS" dtbs 2>&1 | tee -a build.log || echo "::warning::dtbs target reported a problem; continuing (Image is the deliverable)"
        BUILD_END=$(date +%s)
        echo "BUILD_TIME=$((BUILD_END - BUILD_START))" >> "$GITHUB_ENV"

        IMG="$OUT/arch/arm64/boot/Image"
        [ -f "$IMG" ] || { echo "::error::Kernel Image missing"; tail -n 100 build.log || true; exit 1; }
        echo "✅ Build completed"
        echo "::endgroup::"

    - name: Verify Stock Config Spoof
      shell: bash
      run: |
        set -euo pipefail
        echo "::group::Verify stock config spoof"
        IMG="$KERNEL_FOLDER/out/arch/arm64/boot/Image"
        [ -f "$IMG" ] || { echo "::error::Image missing for spoof verification"; exit 1; }
        EXTRACTED="$RUNNER_TEMP/embedded.config"
        sh "$KERNEL_FOLDER/scripts/extract-ikconfig" "$IMG" > "$EXTRACTED" || { echo "::error::Unable to extract embedded config from Image"; exit 1; }
        head -n 5 "$EXTRACTED" | grep -q "Kernel Configuration" || { echo "::error::Embedded config has no kernel-config header — spoof failed"; exit 1; }
        if grep -qE 'CONFIG_KSU|SCHED_BORE|SUSFS' "$EXTRACTED"; then
          echo "::error::Embedded /proc/config.gz still exposes KSU/SUSFS/BORE — spoof failed"
          exit 1
        fi
        echo "✅ /proc/config.gz will report the stock config (no KSU/SUSFS/BORE markers)"
        echo "::endgroup::"

    - name: Collect Build Stats / Validate Image
      id: collect_stats
      shell: bash
      run: |
        set -euo pipefail
        echo "::group::Collect Build stats"
        IMG="$KERNEL_FOLDER/out/arch/arm64/boot/Image"
        [ -f "$IMG" ] || { echo "::error::Kernel Image not found at: $IMG"; exit 1; }
        file "$IMG" | grep -qi 'ARM64' || { echo "::error::Image is not ARM64 format"; file "$IMG"; exit 1; }
        IMG_SIZE=$(stat -c %s "$IMG")
        [ "$IMG_SIZE" -ge 6102400 ] || { echo "::error::Image size too small: $(numfmt --to=iec-i --suffix=B "$IMG_SIZE")"; exit 1; }
        IMG_SHA256=$(sha256sum "$IMG" | awk '{print $1}')
        WARNINGS_COUNT="$(grep -ciE '\bwarning:' "$KERNEL_FOLDER/build.log" || true)"
        KERNEL_UNAME=$(strings "$IMG" | grep -E 'Linux version.*#' | tail -n1 || true)
        echo "KERNEL_UNAME=$KERNEL_UNAME" >> "$GITHUB_ENV"
        printf 'warnings_count=%s\n' "${WARNINGS_COUNT:-0}" >> "$GITHUB_OUTPUT"
        printf 'image_sha256=%s\n' "$IMG_SHA256" >> "$GITHUB_OUTPUT"
        printf 'build_time=%s\n' "${BUILD_TIME:-0}" >> "$GITHUB_OUTPUT"
        cp "$IMG" "$ARTIFACTS_FOLDER/${OP_MODEL}_${OP_OS_VERSION}_${KERNEL_FULL_VER}.Image"
        echo "✅ Image valid: $(numfmt --to=iec-i --suffix=B "$IMG_SIZE") sha256=$IMG_SHA256"
        echo "::endgroup::"

    - name: Collect Module.symvers
      shell: bash
      run: |
        set -euo pipefail
        SYM="$KERNEL_FOLDER/out/Module.symvers"
        if [ -f "$SYM" ]; then
          cp "$SYM" "$ARTIFACTS_FOLDER/${OP_MODEL}_${OP_OS_VERSION}_${KERNEL_FULL_VER}_Module.symvers"
          cp "$SYM" "$DEBUG_ARTIFACTS_FOLDER/Module.symvers"
          echo "✅ Module.symvers archived"
        else
          echo "ⓘ Module.symvers not produced by this Image-only build"
        fi

    - name: Save Build Metadata
      id: save_metadata
      shell: bash
      run: |
        set -euo pipefail
        echo "kernel_version=$KERNEL_FULL_VER" >> "$GITHUB_OUTPUT"
        echo "ksu_version=${KSUVER:-unknown}" >> "$GITHUB_OUTPUT"
        echo "ksu_type=${{ inputs.ksu_type }}" >> "$GITHUB_OUTPUT"
        echo "build_timestamp=${EFFECTIVE_BUILD_TIMESTAMP:-unknown}" >> "$GITHUB_OUTPUT"
        echo "susfs_version=${SUSVER:-unknown}" >> "$GITHUB_OUTPUT"

    - name: Create Kernel ZIP
      id: create_zip
      shell: bash
      run: |
        set -euo pipefail
        echo "::group::Create kernel ZIP package"
        IMAGE_PATH="$KERNEL_FOLDER/out/arch/arm64/boot/Image"
        [ -f "$IMAGE_PATH" ] || { echo "::error::Built Image not found"; exit 1; }

        # The device keeps its stock vendor modules; only the kernel Image is
        # replaced. AnyKernel3 (do.modules=0) flashes Image only.
        cp "$IMAGE_PATH" "$AK3_FOLDER/Image"
        mv "${ARTIFACTS_FOLDER}/${OP_MODEL}_${OP_OS_VERSION}.txt" "$AK3_FOLDER/" || true
        cd "$AK3_FOLDER"
        sed -i 's/do.check_boot_version=.*/do.check_boot_version=1/' anykernel.sh

        ZIP_NAME="AK3_${OP_MODEL}_${OP_OS_VERSION}_${KERNEL_FULL_VER}_${{ inputs.ksu_type }}_${KSUVER:-unknown}_SuSFS_${SUSVER:-unknown}.zip"
        rm -f "$ZIP_NAME"
        zip -r9 "$ZIP_NAME" ./* -x "*.git*" -x "$ZIP_NAME" -x "README.md" >/tmp/zip.log 2>&1 || { cat /tmp/zip.log; echo "::error::Failed to create ZIP"; exit 1; }
        mv "$ZIP_NAME" "$ARTIFACTS_FOLDER/"
        ZIP_SHA256=$(sha256sum "$ARTIFACTS_FOLDER/$ZIP_NAME" | awk '{print $1}')
        echo "zip_sha256=$ZIP_SHA256" >> "$GITHUB_OUTPUT"
        echo "zip_name=$ZIP_NAME" >> "$GITHUB_OUTPUT"
        echo "ZIP_NAME=$ZIP_NAME" >> "$GITHUB_ENV"
        echo "✅ Kernel ZIP: $ZIP_NAME ($ZIP_SHA256)"
        echo "::endgroup::"

    - name: 📊 ccache Post-Build Statistics
      id: ccache_stats
      if: ${{ (inputs.clean == false || inputs.clean == 'false') }}
      shell: bash
      run: |
        set -euo pipefail
        export CCACHE_DIR="${{ env.CCACHE_DIR }}"
        ccache -c || true
        find "$CCACHE_DIR" -type f -mtime +0.5 -delete 2>/dev/null || true
        find "$CCACHE_DIR" -type d -empty -delete 2>/dev/null || true
        STATS="$(ccache -s || true)"
        CACHEABLE=$(echo "$STATS" | awk '/Cacheable calls:/ { match($0, /[0-9]+/); print substr($0, RSTART, RLENGTH) }' | head -n1)
        HITS=$(echo "$STATS" | awk '/^[[:space:]]*Hits:/ { match($0, /[0-9]+/); print substr($0, RSTART, RLENGTH) }' | head -n1)
        DIRECT=$(echo "$STATS" | awk '/Direct:/ { match($0, /[0-9]+/); print substr($0, RSTART, RLENGTH) }' | head -n1)
        if [ "${CACHEABLE:-0}" -gt 0 ]; then
          HIT_RATE=$(awk -v h="${HITS:-0}" -v c="$CACHEABLE" 'BEGIN{printf "%.1f", (h/c)*100}')
          DIRECT_RATE=$(awk -v d="${DIRECT:-0}" -v c="$CACHEABLE" 'BEGIN{printf "%.1f", (d/c)*100}')
        else
          HIT_RATE="0.0"; DIRECT_RATE="0.0"
        fi
        echo "hit_rate=${HIT_RATE}%" >> "$GITHUB_OUTPUT"
        echo "direct_rate=${DIRECT_RATE}%" >> "$GITHUB_OUTPUT"

    - name: Final Build Summary
      shell: bash
      run: |
        set -euo pipefail
        {
          echo "Model: $OP_MODEL"
          echo "Device: giuliac"
          echo "Kernel full: $KERNEL_FULL_VER"
          echo "Kernel Uname: ${KERNEL_UNAME:-unknown}"
          echo "BakaSU Version: ${KSUVER:-unknown}"
          echo "BakaSU commit SHA: ${KSU_COMMIT_SHA:-unknown}"
          echo "SUSFS Version: ${SUSVER:-unknown}"
          echo "SUSFS commit SHA: ${SUSFS_COMMIT_SHA:-unknown}"
          echo "Image SHA256: ${{ steps.collect_stats.outputs.image_sha256 }}"
          echo "AnyKernel3 ZIP SHA256: ${{ steps.create_zip.outputs.zip_sha256 }}"
          echo "Compiler: ${CLANG_VERSION:-unknown}"
          echo "Warnings Count: ${{ steps.collect_stats.outputs.warnings_count }}"
          echo "Artifact Name: ${ZIP_NAME}"
        } | tee summary.txt
        {
          echo "### 🎯 Kernel Build Summary"
          echo ""
          echo "| Metric | Value |"
          echo "|--------|-------|"
          echo "| **Device** | giuliac |"
          echo "| **Kernel Version** | $KERNEL_FULL_VER |"
          echo "| **Kernel Uname** | \`${KERNEL_UNAME:-unknown}\` |"
          echo "| **BakaSU Version** | ${KSUVER:-unknown} |"
          echo "| **SUSFS Version** | ${SUSVER:-unknown} |"
          echo "| **Artifact Name** | \`${ZIP_NAME}\` |"
        } >> "$GITHUB_STEP_SUMMARY"

    - name: Upload Debug Artifacts
      if: ${{ always() && !cancelled() && inputs.debug == 'true' }}
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
      with:
        name: ${{ env.DEBUG_ZIP_NAME }}
        path: ${{ env.DEBUG_ARTIFACTS_FOLDER }}
        compression-level: 9
        retention-days: 90

    - name: Upload Artifacts
      if: success() && steps.create_zip.conclusion == 'success'
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
      with:
        name: ${{ env.ZIP_NAME }}
        path: ${{ env.ARTIFACTS_FOLDER }}/${{ env.ZIP_NAME }}
        archive: false
        compression-level: 0
        retention-days: 90
