name: 'Download and configure Kernel Source code'

inputs:
  source_location:
    description: 'Folder where the kernel source bundle is created'
    required: true
  kernel_repo:
    description: 'Kernel repository (owner/name)'
    required: true
  kernel_branch:
    description: 'Kernel branch (informational; pinned by kernel_commit)'
    required: true
  kernel_commit:
    description: 'Kernel commit SHA to check out'
    required: true
  kernel_modules_repo:
    description: 'Kernel modules repository (must be a sibling of the kernel dir)'
    required: true
  kernel_modules_commit:
    description: 'Kernel modules commit SHA to check out'
    required: true
  kernel_devicetrees_repo:
    description: 'Kernel devicetrees repository (must be a sibling of the kernel dir)'
    required: true
  kernel_devicetrees_commit:
    description: 'Kernel devicetrees commit SHA to check out'
    required: true
  anykernel3_repo:
    description: 'AnyKernel3 repository (owner/name)'
    required: true
  anykernel3_commit:
    description: 'AnyKernel3 commit SHA to check out'
    required: true
  github_token:
    description: 'GitHub Token'
    required: true
  debug:
    description: 'Enable Logs'
    required: false
    type: boolean
    default: false

runs:
  using: 'composite'
  steps:
    - name: Checkout kernel sources
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github_token }}
      working-directory: ${{ inputs.source_location }}
      run: |
        set -euo pipefail

        # The kernel tree reaches into its sibling repos through cross-repo
        # symlinks (for example drivers/base/kernelFwUpdate -> ../../sm8650-modules/...),
        # so all three must be checked out as siblings. AnyKernel3 also lives
        # beside them (the build action stages the flashable ZIP from it).
        fetch_repo() {
          local repo="$1" commit="$2" dir="$3"
          [[ "$commit" =~ ^[0-9a-f]{40}$ ]] || { echo "Invalid commit for ${repo}: ${commit}" >&2; exit 1; }
          rm -rf "$dir"
          git clone --no-checkout "https://github.com/${repo}.git" "$dir"
          git -C "$dir" fetch --depth=1 origin "$commit"
          git -C "$dir" checkout --detach FETCH_HEAD
          test "$(git -C "$dir" rev-parse HEAD)" = "$commit"
          echo "✅ ${repo} @ ${commit:0:8} -> ${dir}"
        }

        fetch_repo "${{ inputs.kernel_repo }}"            "${{ inputs.kernel_commit }}"            "sm8650"
        fetch_repo "${{ inputs.kernel_modules_repo }}"    "${{ inputs.kernel_modules_commit }}"    "sm8650-modules"
        fetch_repo "${{ inputs.kernel_devicetrees_repo }}" "${{ inputs.kernel_devicetrees_commit }}" "sm8650-devicetrees"
        fetch_repo "${{ inputs.anykernel3_repo }}"        "${{ inputs.anykernel3_commit }}"        "AnyKernel3"

        # Sanity: the kernel's cross-repo symlinks must resolve.
        test -e "sm8650/drivers/base/kernelFwUpdate/Kconfig" \
          || { echo 'Kernel tree kernelFwUpdate symlink does not resolve; modules repo mismatch' >&2; exit 1; }
        test -d "sm8650/arch/arm64/boot/dts/vendor" \
          || { echo 'Kernel tree devicetrees symlink does not resolve; devicetrees repo mismatch' >&2; exit 1; }
