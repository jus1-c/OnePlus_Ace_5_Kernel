name: Build OnePlus Ace 5 A16

on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: Create a GitHub prerelease after every target passes
        required: true
        type: boolean
        default: false
      clean_build:
        description: Disable ccache for this run
        required: true
        type: boolean
        default: false
      optimize_level:
        description: Compiler optimization level
        required: true
        type: choice
        options: [O2, O3]
        default: O2
      debug:
        description: Upload debug build artifacts
        required: true
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

env:
  CHECKOUT_SHA: d23441a48e516b6c34aea4fa41551a30e30af803
  DOWNLOAD_ARTIFACT_SHA: 3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
  UPLOAD_ARTIFACT_SHA: 043fb46d1a93c77aae656e7c1c64a875d1fc6a0a

jobs:
  resolve:
    name: Resolve and audit immutable sources
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.sources.outputs.matrix }}
      sources: ${{ steps.sources.outputs.sources }}
      wild_release: ${{ steps.sources.outputs.wild_release }}
    steps:
      - name: Checkout fork scripts
        id: checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 1

      - name: Install resolver dependencies
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends jq curl git libxml2-utils

      - name: Resolve sources and Ace 5 matrix
        id: sources
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          sources=$(bash scripts/resolve_sources.sh)
          wild_repo=$(jq -r '.wild_repo' <<< "$sources")
          wild_sha=$(jq -r '.wild_sha' <<< "$sources")
          mapfile -t configs < <(jq -r '.configs[]' <<< "$sources")
          matrix='[]'
          for config_path in "${configs[@]}"; do
            config=$(curl --fail --location --silent --show-error \
              "https://raw.githubusercontent.com/${wild_repo}/${wild_sha}/${config_path}")
            manifest=$(jq -r '.manifest' <<< "$config")
            manifest_url="https://raw.githubusercontent.com/${wild_repo}/${wild_sha}/manifests/a16/${manifest}"
            entry=$(jq -c --arg manifest_url "$manifest_url" '. + {manifest:$manifest_url, ksu_type:"ReSukiSU", uname:"OP-ACE5-RESUKISU", blacklist_modules:""}' <<< "$config")
            matrix=$(jq -c --argjson entry "$entry" '. + [$entry]' <<< "$matrix")
          done
          [[ $(jq 'length' <<< "$matrix") -gt 0 ]] || { echo 'Empty Ace 5 matrix' >&2; exit 1; }
          printf '%s\n' "$sources" > resolved-sources.json
          printf '%s\n' "$matrix" > ace5-matrix.json
          matrix_json=$(jq -cn --argjson include "$matrix" '{include:$include}')
          {
            echo "sources<<EOF"
            echo "$sources"
            echo EOF
            echo "matrix<<EOF"
            echo "$matrix_json"
            echo EOF
            echo "wild_release=$(jq -r '.wild_release' <<< "$sources")"
          } >> "$GITHUB_OUTPUT"

      - name: Audit WildKernel stability contract
        id: wild_audit
        if: ${{ always() }}
        env:
          GH_TOKEN: ${{ github.token }}
          WILD_REPO: WildKernels/OnePlus_KernelSU_SUSFS
          WILD_TAG: ${{ steps.sources.outputs.wild_release }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p source-snapshot
          [[ ! -f resolved-sources.json ]] || cp resolved-sources.json source-snapshot/resolved-sources.json
          [[ ! -f ace5-matrix.json ]] || cp ace5-matrix.json source-snapshot/ace5-matrix.json
          set +e
          if [[ -n "$WILD_TAG" ]]; then
            bash scripts/audit_wild_release.sh --tag "$WILD_TAG" --output source-snapshot/wild-audit.json
          fi
          set -e
          if [[ ! -s source-snapshot/wild-audit.json ]]; then
            cat > source-snapshot/wild-audit.json <<EOF
          {
            "status": "fail",
            "repository": "${WILD_REPO}",
            "candidate": {"tag":"${WILD_TAG}"},
            "baseline": {},
            "compare": {"url":"","status":"","files":[],"commits":[]},
            "control_plane": {"candidate":{},"baseline":{},"changes":[]},
            "ace5": {"configs":[],"manifests":[],"path_changes":{},"config_schema":[],"schema_errors":[],"contract_errors":[],"manifest_errors":[]},
            "reasons": ["Source resolution failed before WildKernel audit could run"],
            "run_url": "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          }
          EOF
          fi
          if [[ -s source-snapshot/resolved-sources.json ]]; then
            jq --slurpfile sources source-snapshot/resolved-sources.json '
              .source_snapshot = {
                wild_sha: $sources[0].wild_sha,
                susfs_sha: $sources[0].susfs_sha,
                kernel_patches_sha: $sources[0].kernel_patches_sha
              }
            ' source-snapshot/wild-audit.json > source-snapshot/wild-audit.tmp
            mv source-snapshot/wild-audit.tmp source-snapshot/wild-audit.json
            if ! jq -e '
              .candidate.commit == .source_snapshot.wild_sha and
              .candidate.susfs_commit == .source_snapshot.susfs_sha and
              .candidate.kernel_patches_commit == .source_snapshot.kernel_patches_sha
            ' source-snapshot/wild-audit.json >/dev/null; then
              jq --arg reason 'Resolved source snapshot differs from audited WildKernel snapshot' \
                '.status = "fail" | .reasons += [$reason]' source-snapshot/wild-audit.json > source-snapshot/wild-audit.tmp
              mv source-snapshot/wild-audit.tmp source-snapshot/wild-audit.json
            fi
          fi
          jq -r '
            "# WildKernel Audit\n",
            "- Status: **\(.status)**",
            "- Candidate: `\(.candidate.tag // "unknown")` (`\(.candidate.commit // "unknown")`)\n",
            "## Reasons",
            (.reasons[]? | "- \(.)"),
            "\n## Control-plane changes",
            (.control_plane.changes[]? | "- \(.path): `\(.baseline)` -> `\(.candidate)`"),
            "\n## Compare",
            "- Status: `\(.compare.status // "unknown")`",
            "- URL: \(.compare.url // "")"
          ' source-snapshot/wild-audit.json > source-snapshot/wild-audit.md

      - name: Upload source snapshot
        if: ${{ always() && steps.checkout.outcome == 'success' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: resolved-sources
          path: source-snapshot
          if-no-files-found: error
          retention-days: 90

      - name: Enforce WildKernel stability contract
        if: ${{ always() }}
        env:
          RESOLVE_OUTCOME: ${{ steps.sources.outcome }}
        run: |
          set -euo pipefail
          [[ "$RESOLVE_OUTCOME" == success ]] || {
            echo 'Source resolution failed; refusing to start kernel builds.' >&2
            exit 1
          }
          jq -e '.status == "pass"' source-snapshot/wild-audit.json >/dev/null || {
            echo 'WildKernel stability audit failed; refusing to start kernel builds.' >&2
            exit 1
          }

  build:
    name: Build ${{ matrix.model }}
    needs: resolve
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.resolve.outputs.matrix) }}
    steps:
      - name: Checkout fork
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 1

      - name: Install base dependencies
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            git curl ca-certificates build-essential clang lld flex bison libelf-dev libssl-dev \
            libncurses-dev zlib1g-dev liblz4-tool libxml2-utils rsync unzip dwarves file \
            python3 ccache jq bc dos2unix kmod libdw-dev elfutils pigz aria2 zip

      - name: Read resolved source snapshot
        run: |
          set -euo pipefail
          mkdir -p source-snapshot
          echo '${{ needs.resolve.outputs.sources }}' > source-snapshot/resolved-sources.json
          jq -e '.wild_sha and .susfs_sha and .resukisu_sha and .nomount_sha' source-snapshot/resolved-sources.json >/dev/null

      - name: Build kernel with ReSukiSU, SUSFS, and NoMount
        uses: ./.github/actions/build-kernel
        with:
          op_config_json: ${{ toJSON(matrix) }}
          ksu_type: ReSukiSU
          ksu_branch_or_hash: ${{ fromJSON(needs.resolve.outputs.sources).resukisu_sha }}
          susfs_commit_hash_or_branch: ${{ fromJSON(needs.resolve.outputs.sources).susfs_sha }}
          nomount_commit: ${{ fromJSON(needs.resolve.outputs.sources).nomount_sha }}
          bbg_repo: ${{ fromJSON(needs.resolve.outputs.sources).bbg_repo }}
          bbg_commit: ${{ fromJSON(needs.resolve.outputs.sources).bbg_sha }}
          kernel_patches_repo: ${{ fromJSON(needs.resolve.outputs.sources).kernel_patches_repo }}
          kernel_patches_commit: ${{ fromJSON(needs.resolve.outputs.sources).kernel_patches_sha }}
          optimize_level: ${{ inputs.optimize_level }}
          clean: ${{ inputs.clean_build }}
          debug: ${{ inputs.debug }}
          github_token: ${{ github.token }}

      - name: Upload source snapshot with target
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: provenance-${{ matrix.model }}
          path: source-snapshot/resolved-sources.json
          retention-days: 90

  nethunter-takeover:
    name: NetHunter Takeover ${{ matrix.model }}
    needs: [resolve, build]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.resolve.outputs.matrix) }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 1

      - name: Build takeover modules
        uses: ./.github/actions/build-nethunter-takeover
        with:
          target: ${{ matrix.model }}
          version: ${{ github.run_number }}

      - name: Upload takeover ZIP
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: nethunter-takeover-${{ matrix.model }}
          path: |
            dist/nethunter-takeover-*.zip
            dist/provenance-*.json
          retention-days: 90

  nomount-module:
    name: Package NoMount userspace
    needs: resolve
    runs-on: ubuntu-latest
    steps:
      - name: Checkout fork
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 1

      - name: Install build tools
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends curl ca-certificates xz-utils zip coreutils

      - name: Build NoMount module from resolved commit
        env:
          NOMOUNT_SHA: ${{ fromJSON(needs.resolve.outputs.sources).nomount_sha }}
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error \
            https://ziglang.org/download/0.14.0/zig-linux-x86_64-0.14.0.tar.xz -o zig.tar.xz
          echo '473ec26806133cf4d1918caf1a410f8403a13d979726a9045b421b685031a982  zig.tar.xz' | sha256sum -c -
          tar -xf zig.tar.xz
          export PATH="$PWD/zig-linux-x86_64-0.14.0:$PATH"
          git clone --no-checkout https://github.com/maxsteeel/nomount.git nomount
          git -C nomount fetch --depth=1 origin "$NOMOUNT_SHA"
          git -C nomount checkout --detach FETCH_HEAD
          test "$(git -C nomount rev-parse HEAD)" = "$NOMOUNT_SHA"
          mkdir -p package/bin
          zig cc -target aarch64-linux -Oz -mcmodel=tiny -static -nostdlib -ffreestanding \
            -fno-unwind-tables -fno-ident -Wno-invalid-noreturn -Wl,--entry=_start \
            nomount/userspace/src/nm.c -o package/bin/nm-arm64
          git clone --no-checkout "https://github.com/${{ fromJSON(needs.resolve.outputs.sources).loader_repo }}.git" ko-loader
          git -C ko-loader fetch --depth=1 origin "${{ fromJSON(needs.resolve.outputs.sources).loader_sha }}"
          git -C ko-loader checkout --detach FETCH_HEAD
          test "$(git -C ko-loader rev-parse HEAD)" = "${{ fromJSON(needs.resolve.outputs.sources).loader_sha }}"
          make -C ko-loader TARGET=aarch64-linux
          cp ko-loader/ko-loader package/bin/ko-loader-arm64
          cp -a nomount/module/. package/
          NOMOUNT_BASE_VERSION=$(awk -F= '$1 == "version" { print $2; exit }' package/module.prop | tr -cd '[:alnum:]._-')
          NOMOUNT_BASE_VERSION="${NOMOUNT_BASE_VERSION:-dev}"
          NOMOUNT_BRANCH="${{ fromJSON(needs.resolve.outputs.sources).nomount_branch }}"
          NOMOUNT_SHORT_SHA="${NOMOUNT_SHA:0:12}"
          RUN_SHA="${NOMOUNT_SHORT_SHA}-$(date -u +%Y%m%d%H%M%S)"
          sed -i "s/^version=.*/version=dev-${RUN_SHA}/" package/module.prop
          sed -i "s/^versionCode=.*/versionCode=${GITHUB_RUN_ID:-0}/" package/module.prop
          sha256sum package/bin/ko-loader-arm64 > package/bin/ko-loader-arm64.sha256
          sha256sum package/bin/nm-arm64 > package/bin/nm-arm64.sha256
          NOMOUNT_ZIP="NoMount-${NOMOUNT_BASE_VERSION}-${NOMOUNT_BRANCH}-${NOMOUNT_SHORT_SHA}.zip"
          (cd package && zip -r9 "../${NOMOUNT_ZIP}" .)

      - name: Upload NoMount module
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: nomount-module
          path: NoMount-*.zip
          archive: false
          compression-level: 0
          if-no-files-found: error
          retention-days: 90

  release:
    name: Publish release
    needs: [resolve, build, nomount-module]
    if: ${{ inputs.publish_release && needs.build.result == 'success' && needs.nomount-module.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: release-assets
          merge-multiple: true
          skip-decompress: true

      - name: Prepare release assets and notes
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCES: ${{ needs.resolve.outputs.sources }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          mapfile -t kernel_zips < <(find release-assets -maxdepth 1 -type f -name 'AK3_*.zip' | sort)
          mapfile -t nomount_zips < <(find release-assets -maxdepth 1 -type f -name 'NoMount-*.zip' | sort)
          [[ "${#kernel_zips[@]}" -eq 2 ]] || { echo 'Expected exactly two kernel ZIPs' >&2; find release-assets -maxdepth 1 -type f || true; exit 1; }
          [[ "${#nomount_zips[@]}" -eq 1 ]] || { echo 'Expected exactly one NoMount ZIP' >&2; find release-assets -maxdepth 1 -type f || true; exit 1; }

          wild_release=$(jq -r '.wild_release' <<< "$SOURCES")
          wild_sha=$(jq -r '.wild_sha' <<< "$SOURCES")
          nomount_branch=$(jq -r '.nomount_branch' <<< "$SOURCES")
          nomount_sha=$(jq -r '.nomount_sha' <<< "$SOURCES")
          nomount_short_sha="${nomount_sha:0:12}"
          nomount_asset=$(basename "${nomount_zips[0]}")
          nomount_suffix="-${nomount_branch}-${nomount_short_sha}.zip"
          [[ "$nomount_asset" == NoMount-*"$nomount_suffix" ]] || {
            echo "NoMount asset has unexpected name: $nomount_asset" >&2
            exit 1
          }
          nomount_version="${nomount_asset#NoMount-}"
          nomount_version="${nomount_version%$nomount_suffix}"

          find release-assets -maxdepth 1 -type f ! -name 'AK3_*.zip' ! -name "$nomount_asset" -delete
          jq . <<< "$SOURCES" > release-assets/resolved-sources.json
          sha256sum release-assets/*.zip | sort -k2 > release-assets/00_CHECKSUMS.txt

          release_tag="ace5-${wild_release}-nm-${nomount_branch}-${nomount_short_sha}"
          if gh release view "$release_tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            release_tag="${release_tag}-r${GITHUB_RUN_NUMBER}"
          fi
          echo "RELEASE_TAG=$release_tag" >> "$GITHUB_ENV"
          echo "NOMOUNT_ASSET=$nomount_asset" >> "$GITHUB_ENV"
          echo "NOMOUNT_VERSION=$nomount_version" >> "$GITHUB_ENV"

          {
            echo "# OnePlus Ace 5 Kernel 📦 NoMount (${nomount_version})"
            echo
            echo "**A custom OnePlus Ace 5 kernel plus a mountless NoMount add-on.**"
            echo
            echo "## This release contains two downloads"
            echo
            echo '1. **Kernel** — flash the matching `AK3_...zip` with Kernel Flasher or KernelSU Manager.'
            printf '2. **NoMount module** — install `%s` from KernelSU Manager Modules after rebooting into the kernel.\n' "$nomount_asset"
            echo
            echo "> NoMount is compiled into kernel but remains dormant until module activates it. Install both."
            echo
            echo "## Kernel downloads"
            echo
            echo "| Asset | SHA256 |"
            echo "|---|---|"
            for file in release-assets/AK3_*.zip; do
              name=$(basename "$file")
              sha=$(sha256sum "$file" | awk '{print $1}')
              printf '| `%s` | `%s` |\n' "$name" "$sha"
            done
            sha=$(sha256sum "release-assets/${nomount_asset}" | awk '{print $1}')
            printf '| `%s` | `%s` |\n' "$nomount_asset" "$sha"
            echo
            echo "## Build configuration"
            echo
            echo "| Component | Value |"
            echo "|---|---|"
            printf '| WildKernel release | `%s` |\n' "$wild_release"
            printf '| WildKernel commit | `%s` |\n' "$wild_sha"
            printf '| NoMount branch | `%s` |\n' "$nomount_branch"
            printf '| NoMount commit | `%s` |\n' "$nomount_sha"
            echo "| Root | ReSukiSU |"
            printf '| Optimization | `%s` |\n' '${{ inputs.optimize_level }}'
            printf '| Clean build | `%s` |\n' '${{ inputs.clean_build }}'
            echo
            echo "## Installation"
            echo
            echo "1. Select ZIP matching exact device and kernel version."
            echo "2. Keep stock boot image for rollback."
            echo "3. Flash kernel ZIP with Kernel Flasher."
            echo "4. Boot and install NoMount module from KernelSU Manager."
            echo "5. Reboot again."
            echo
            echo "## Features"
            echo
            echo "ReSukiSU, SUSFS, NoMount, BBG, BBRv1/v3, CAKE/PIE/FQ_PIE, WireGuard, IP Set, IPv6 NAT, TTL/HL, ThinLTO, Unicode fix, Droidspaces, NTSync, and TMPFS ACL/XATTR."
            echo
            echo "## Sources"
            echo
            echo 'See `resolved-sources.json` and `00_CHECKSUMS.txt` attached to this release.'
            echo
            echo "Build run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          } > release-assets/00_DOWNLOADS.md

      - name: Create prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$RELEASE_TAG" release-assets/* \
            --repo "$GITHUB_REPOSITORY" \
            --prerelease \
            --title "OnePlus Ace 5 Kernel 📦 NoMount (${NOMOUNT_VERSION})" \
            --notes-file release-assets/00_DOWNLOADS.md
