name: Build OnePlus Ace 5 A16

on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: Create a GitHub prerelease after every target passes
        required: true
        type: boolean
        default: false
      clean_build:
        description: Disable ccache for this run
        required: true
        type: boolean
        default: false
      optimize_level:
        description: Compiler optimization level
        required: true
        type: choice
        options: [O2, O3]
        default: O2
      debug:
        description: Upload debug build artifacts
        required: true
        type: boolean
        default: false
      prerelease:
        description: Mark release as pre-release
        required: true
        type: boolean
        default: true

permissions:
  contents: read
  actions: read

env:
  CHECKOUT_SHA: d23441a48e516b6c34aea4fa41551a30e30af803
  DOWNLOAD_ARTIFACT_SHA: 3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
  UPLOAD_ARTIFACT_SHA: 043fb46d1a93c77aae656e7c1c64a875d1fc6a0a

jobs:
  resolve:
    name: Resolve immutable sources
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.sources.outputs.matrix }}
      sources: ${{ steps.sources.outputs.sources }}
      kernel_version: ${{ steps.sources.outputs.kernel_version }}
    steps:
      - name: Checkout fork scripts
        id: checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 1

      - name: Install resolver dependencies
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends jq curl git libxml2-utils

      - name: Resolve sources and giuliac matrix
        id: sources
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          sources=$(bash scripts/resolve_sources.sh)
          printf '%s\n' "$sources" > resolved-sources.json

          kernel_branch=$(jq -r '.kernel_branch' <<< "$sources")
          kernel_sha=$(jq -r '.kernel_sha' <<< "$sources")
          kernel_repo=$(jq -r '.kernel_repo' <<< "$sources")
          kernel_path=$(jq -r '.kernel_path' <<< "$sources")

          # Derive the kernel version from the resolved kernel Makefile, never
          # hardcode it. The branch is currently 6.1.176 but must not be pinned.
          makefile=$(curl --fail --location --silent --show-error \
            "https://raw.githubusercontent.com/${kernel_repo}/${kernel_sha}/Makefile")
          VERSION=$(awk '/^VERSION *=/{print $3}' <<< "$makefile")
          PATCHLEVEL=$(awk '/^PATCHLEVEL *=/{print $3}' <<< "$makefile")
          SUBLEVEL=$(awk '/^SUBLEVEL *=/{print $3}' <<< "$makefile")
          [[ -n "$VERSION" && -n "$PATCHLEVEL" && -n "$SUBLEVEL" ]] || { echo 'Cannot derive kernel version from resolved Makefile' >&2; exit 1; }
          kernel_version="${VERSION}.${PATCHLEVEL}"
          kernel_full="${VERSION}.${PATCHLEVEL}.${SUBLEVEL}"
          echo "Resolved kernel: ${kernel_full} (${kernel_sha:0:8})"

          entry=$(jq -c --arg full "$kernel_full" '
            . + {model:"OP-ACE-5", uname:"OP-ACE5-BAKASU", ksu_type:"BakaSU"}
          ' configs/a16/OP-ACE-5.json)
          entry=$(jq -c --arg full "$kernel_full" '.kernel_version=$full | .kernel_version=(($full|split("."))[0:2]|join("."))' <<< "$entry")
          matrix=$(jq -cn --argjson e "$entry" '{include:[$e]}')

          {
            echo "sources<<EOF"
            echo "$sources"
            echo EOF
            echo "matrix<<EOF"
            echo "$matrix"
            echo EOF
            echo "kernel_version=${kernel_full}"
          } >> "$GITHUB_OUTPUT"

      - name: Upload source snapshot
        if: ${{ always() && steps.checkout.outcome == 'success' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: resolved-sources
          path: resolved-sources.json
          if-no-files-found: error
          retention-days: 90

      - name: Enforce source resolution
        if: ${{ always() }}
        env:
          RESOLVE_OUTCOME: ${{ steps.sources.outcome }}
        run: |
          set -euo pipefail
          [[ "$RESOLVE_OUTCOME" == success ]] || {
            echo 'Source resolution failed; refusing to start kernel builds.' >&2
            exit 1
          }

  build:
    name: Build ${{ matrix.model }}
    needs: resolve
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.resolve.outputs.matrix) }}
    steps:
      - name: Checkout fork
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 1

      - name: Install base dependencies
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            git curl ca-certificates build-essential clang lld flex bison libelf-dev libssl-dev \
            libncurses-dev zlib1g-dev liblz4-tool libxml2-utils rsync unzip dwarves file \
            python3 ccache jq bc dos2unix kmod libdw-dev elfutils pigz aria2 zip

      - name: Stage resolved source snapshot
        env:
          SOURCES: ${{ needs.resolve.outputs.sources }}
        run: |
          set -euo pipefail
          mkdir -p source-snapshot
          printf '%s\n' "$SOURCES" > source-snapshot/resolved-sources.json
          jq -e '.kernel_sha and .kernel_modules_sha and .kernel_devicetrees_sha and .gki_sha and .susfs_sha and .bakasu_sha and .nomount_sha and .vpnhide_sha and .droidspaces_sha and .kernel_patches_sha and .anykernel3_sha and .vpnhide_builtin_sha256 and .vpnhide_apk_sha256' source-snapshot/resolved-sources.json >/dev/null

      - name: Fetch clang toolchain
        env:
          SOURCES: ${{ needs.resolve.outputs.sources }}
        run: |
          set -euo pipefail
          # The Lunaris tree is built with clang-r563880c (see
          # aosp-for-giulia/scripts_kernel_oneplus_sm8650/build.sh), which the
          # action loads from $CONFIG_FOLDER/toolchain/clang/bin.
          mkdir -p "$GITHUB_WORKSPACE/OP-ACE-5/toolchain"
          git clone --depth=1 https://github.com/realahnet/clang-r563880c.git "$GITHUB_WORKSPACE/OP-ACE-5/toolchain/clang"
          test -x "$GITHUB_WORKSPACE/OP-ACE-5/toolchain/clang/bin/clang"

      - name: Restore ccache
        id: ccache-restore
        if: ${{ !inputs.clean_build }}
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.2.0
        with:
          path: ${{ github.workspace }}/.ccache
          key: ccache-${{ matrix.model }}-${{ needs.resolve.outputs.kernel_version }}-${{ github.run_id }}
          restore-keys: |
            ccache-${{ matrix.model }}-${{ needs.resolve.outputs.kernel_version }}-
            ccache-${{ matrix.model }}-

      - name: Build kernel (Lunaris giuliac + GKI features)
        uses: ./.github/actions/build-kernel
        with:
          op_config_json: ${{ toJSON(matrix) }}
          kernel_repo: ${{ fromJSON(needs.resolve.outputs.sources).kernel_repo }}
          kernel_branch: ${{ fromJSON(needs.resolve.outputs.sources).kernel_branch }}
          kernel_commit: ${{ fromJSON(needs.resolve.outputs.sources).kernel_sha }}
          kernel_modules_repo: ${{ fromJSON(needs.resolve.outputs.sources).kernel_modules_repo }}
          kernel_modules_commit: ${{ fromJSON(needs.resolve.outputs.sources).kernel_modules_sha }}
          kernel_devicetrees_repo: ${{ fromJSON(needs.resolve.outputs.sources).kernel_devicetrees_repo }}
          kernel_devicetrees_commit: ${{ fromJSON(needs.resolve.outputs.sources).kernel_devicetrees_sha }}
          anykernel3_repo: ${{ fromJSON(needs.resolve.outputs.sources).anykernel3_repo }}
          anykernel3_commit: ${{ fromJSON(needs.resolve.outputs.sources).anykernel3_sha }}
          gki_commit: ${{ fromJSON(needs.resolve.outputs.sources).gki_sha }}
          ksu_type: BakaSU
          ksu_branch_or_hash: ${{ fromJSON(needs.resolve.outputs.sources).bakasu_sha }}
          susfs_commit_hash_or_branch: ${{ fromJSON(needs.resolve.outputs.sources).susfs_sha }}
          nomount_commit: ${{ fromJSON(needs.resolve.outputs.sources).nomount_sha }}
          bbg_repo: ${{ fromJSON(needs.resolve.outputs.sources).bbg_repo }}
          bbg_commit: ${{ fromJSON(needs.resolve.outputs.sources).bbg_sha }}
          kernel_patches_repo: ${{ fromJSON(needs.resolve.outputs.sources).kernel_patches_repo }}
          kernel_patches_commit: ${{ fromJSON(needs.resolve.outputs.sources).kernel_patches_sha }}
          vpnhide_repo: ${{ fromJSON(needs.resolve.outputs.sources).vpnhide_repo }}
          vpnhide_commit: ${{ fromJSON(needs.resolve.outputs.sources).vpnhide_sha }}
          droidspaces_commit: ${{ fromJSON(needs.resolve.outputs.sources).droidspaces_sha }}
          optimize_level: ${{ inputs.optimize_level }}
          clean: ${{ inputs.clean_build }}
          debug: ${{ inputs.debug }}
          github_token: ${{ github.token }}

      - name: Save ccache
        if: ${{ !inputs.clean_build && steps.ccache-restore.outcome == 'success' }}
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.2.0
        with:
          path: ${{ github.workspace }}/.ccache
          key: ccache-${{ matrix.model }}-${{ needs.resolve.outputs.kernel_version }}-${{ github.run_id }}

      - name: Upload source snapshot with target
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: provenance-${{ matrix.model }}
          path: source-snapshot
          retention-days: 90

  nomount-module:
    name: Fetch NoMount release
    needs: resolve
    runs-on: ubuntu-latest
    steps:
      - name: Checkout fork
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 1

      - name: Download NoMount release module
        env:
          SOURCES: ${{ needs.resolve.outputs.sources }}
        run: |
          set -euo pipefail
          url=$(jq -r '.nomount_asset_url' <<< "$SOURCES")
          digest=$(jq -r '.nomount_asset_sha256' <<< "$SOURCES")
          name=$(jq -r '.nomount_asset_name' <<< "$SOURCES")
          curl --fail --location --silent --show-error "$url" -o "$name"
          printf '%s  %s\n' "$digest" "$name" | sha256sum -c -

      - name: Upload NoMount module
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: nomount-module
          path: NoMount-*.zip
          archive: false
          compression-level: 0
          if-no-files-found: error
          retention-days: 90

  release:
    name: Publish release
    needs: [resolve, build, nomount-module]
    if: ${{ inputs.publish_release && needs.build.result == 'success' && needs.nomount-module.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: release-assets
          merge-multiple: true
          skip-decompress: true

      - name: Prepare release assets and notes
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCES: ${{ needs.resolve.outputs.sources }}
          KERNEL_VERSION: ${{ needs.resolve.outputs.kernel_version }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          mapfile -t kernel_zips < <(find release-assets -maxdepth 1 -type f -name 'AK3_*.zip' | sort)
          mapfile -t nomount_zips < <(find release-assets -maxdepth 1 -type f -name 'NoMount-*.zip' | sort)
          [[ "${#kernel_zips[@]}" -eq 1 ]] || { echo 'Expected exactly one kernel ZIP' >&2; find release-assets -maxdepth 1 -type f || true; exit 1; }
          [[ "${#nomount_zips[@]}" -eq 1 ]] || { echo 'Expected exactly one NoMount ZIP' >&2; find release-assets -maxdepth 1 -type f || true; exit 1; }

          vpnhide_builtin_url=$(jq -r '.vpnhide_builtin_url' <<< "$SOURCES")
          vpnhide_apk_url=$(jq -r '.vpnhide_apk_url' <<< "$SOURCES")
          curl --fail --location --silent --show-error "$vpnhide_builtin_url" -o release-assets/vpnhide-builtin.zip
          curl --fail --location --silent --show-error "$vpnhide_apk_url" -o release-assets/vpnhide.apk
          printf '%s  %s\n' "$(jq -r '.vpnhide_builtin_sha256' <<< "$SOURCES")" release-assets/vpnhide-builtin.zip | sha256sum -c -
          printf '%s  %s\n' "$(jq -r '.vpnhide_apk_sha256' <<< "$SOURCES")" release-assets/vpnhide.apk | sha256sum -c -

          nomount_tag=$(jq -r '.nomount_tag' <<< "$SOURCES")
          nomount_asset=$(basename "${nomount_zips[0]}")
          [[ "$nomount_asset" == "$(jq -r '.nomount_asset_name' <<< "$SOURCES")" ]] || { echo "NoMount asset has unexpected name: $nomount_asset" >&2; exit 1; }

          find release-assets -maxdepth 1 -type f ! -name 'AK3_*.zip' ! -name "$nomount_asset" ! -name 'vpnhide-builtin.zip' ! -name 'vpnhide.apk' -delete
          jq . <<< "$SOURCES" > release-assets/resolved-sources.json
          sha256sum release-assets/*.zip | sort -k2 > release-assets/00_CHECKSUMS.txt

          release_tag="giuliac-${KERNEL_VERSION}-nm-${nomount_tag}"
          if gh release view "$release_tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            release_tag="${release_tag}-r${GITHUB_RUN_NUMBER}"
          fi
          echo "RELEASE_TAG=$release_tag" >> "$GITHUB_ENV"
          echo "NOMOUNT_ASSET=$nomount_asset" >> "$GITHUB_ENV"

          {
            echo "# OnePlus Ace 5 (giuliac) Kernel — ${KERNEL_VERSION} 📦 NoMount (${nomount_tag})"
            echo
            echo "**A custom kernel for OnePlus Ace 5 (giuliac) built from the Lunaris tree, plus a mountless NoMount add-on. Your device keeps its stock vendor modules; only the kernel Image is replaced.**"
            echo
            echo "## Downloads"
            echo
            echo "1. **Kernel** — flash the matching \`AK3_...zip\` with Kernel Flasher or KernelSU Manager."
            printf '2. **NoMount module** — install `%s` from KernelSU Manager Modules after rebooting into the kernel.\n' "$nomount_asset"
            echo
            echo "> NoMount is compiled into the kernel but stays dormant until the module activates it. Install both."
            echo
            echo "## Assets"
            echo
            echo "| Asset | SHA256 |"
            echo "|---|---|"
            for file in release-assets/AK3_*.zip; do
              printf '| `%s` | `%s` |\n' "$(basename "$file")" "$(sha256sum "$file" | awk '{print $1}')"
            done
            printf '| `%s` | `%s` |\n' "$nomount_asset" "$(sha256sum "release-assets/${nomount_asset}" | awk '{print $1}')"
            for file in release-assets/vpnhide-builtin.zip release-assets/vpnhide.apk; do
              printf '| `%s` | `%s` |\n' "$(basename "$file")" "$(sha256sum "$file" | awk '{print $1}')"
            done
            echo
            echo "## Build configuration"
            echo
            echo "| Component | Value |"
            echo "|---|---|"
            printf '| Kernel repo | `%s` |\n' "$(jq -r '.kernel_repo' <<< "$SOURCES")"
            printf '| Kernel branch | `%s` |\n' "$(jq -r '.kernel_branch' <<< "$SOURCES")"
            printf '| Kernel commit | `%s` |\n' "$(jq -r '.kernel_sha' <<< "$SOURCES")"
            printf '| Kernel version | `%s` |\n' "$KERNEL_VERSION"
            printf '| GKI reference | `%s@%s` (`%s`) |\n' "$(jq -r '.gki_repo' <<< "$SOURCES")" "$(jq -r '.gki_branch' <<< "$SOURCES")" "$(jq -r '.gki_sha' <<< "$SOURCES")"
            printf '| NoMount release | `%s` |\n' "$nomount_tag"
            echo "| Root | BakaSU |"
            printf '| Optimization | `%s` |\n' '${{ inputs.optimize_level }}'
            printf '| Clean build | `%s` |\n' '${{ inputs.clean_build }}'
            echo
            echo "## VPNHide"
            echo
            echo "VPNHide built-in backend is compiled into the kernel with CONFIG_VPNHIDE=y and CONFIG_VPNHIDE_FS_HIDING=y."
            echo
            echo '1. Install `vpnhide-builtin.zip` as a KernelSU/Magisk module.'
            echo '2. Install `vpnhide.apk`.'
            echo '3. Enable VPN Hide in LSPosed with `System Framework` in scope.'
            echo '4. Reboot, then configure target apps in VPN Hide.'
            echo '5. Do not install VPNHide kmod, KPM, or Zygisk together with the built-in backend.'
            echo
            echo "## Installation"
            echo
            echo "1. Flash the kernel ZIP with Kernel Flasher."
            echo "2. Keep a stock boot image for rollback."
            echo "3. Boot and install the NoMount module from KernelSU Manager."
            echo "4. Reboot again."
            echo
            echo "## Features"
            echo
            echo "- BakaSU"
            echo "- SUSFS"
            echo "- NoMount"
            echo "- VPNHide"
            echo "- BBG"
            echo "- BBRv1/v3"
            echo "- CAKE/PIE/FQ_PIE"
            echo "- WireGuard"
            echo "- IP Set"
            echo "- IPv6 NAT"
            echo "- TTL/HL"
            echo "- ThinLTO"
            echo "- Unicode fix"
            echo "- Droidspaces"
            echo "- NTSync"
            echo "- TMPFS ACL/XATTR"
            echo
            echo "## Sources"
            echo
            echo 'See `resolved-sources.json` and `00_CHECKSUMS.txt` attached to this release.'
            echo
            echo "Build run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          } > release-assets/00_DOWNLOADS.md

      - name: Generate update.json for NoMount module
        env:
          SOURCES: ${{ needs.resolve.outputs.sources }}
        run: |
          set -euo pipefail
          nomount_tag=$(jq -r '.nomount_tag' <<< "$SOURCES")
          nomount_asset=$(basename "$(find release-assets -maxdepth 1 -type f -name 'NoMount-*.zip' | head -1)")
          zip_url="https://github.com/${GITHUB_REPOSITORY}/releases/download/${RELEASE_TAG}/${nomount_asset}"
          cat > release-assets/update.json <<EOF
          {
            "version": "${nomount_tag}",
            "versionCode": ${GITHUB_RUN_ID},
            "zipUrl": "${zip_url}",
            "changelog": "Official NoMount release ${nomount_tag}\nRun: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          }
          EOF
          cat release-assets/update.json

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RELEASE_ARGS=("$RELEASE_TAG" release-assets/* --repo "$GITHUB_REPOSITORY" --title "OnePlus Ace 5 (giuliac) Kernel (${RELEASE_TAG})" --notes-file release-assets/00_DOWNLOADS.md)
          if [[ "${{ inputs.prerelease }}" == "true" ]]; then
            RELEASE_ARGS+=(--prerelease)
          fi
          gh release create "${RELEASE_ARGS[@]}"
